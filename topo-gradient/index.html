<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Topo Gradient Generator</title>
<style>
:root{--panel:rgba(15,15,16,.92);--border:rgba(255,255,255,.11);--text:#f4f4f4;--muted:rgba(255,255,255,.48);--track:rgba(255,255,255,.18)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}canvas{display:block;width:100%;height:100%;background:#000}.hint{position:fixed;left:18px;top:16px;font-size:12px;color:rgba(255,255,255,.3);pointer-events:none}.seed{position:fixed;left:18px;bottom:14px;font-size:11px;color:rgba(255,255,255,.3);pointer-events:none}.ui{position:fixed;right:16px;bottom:16px;width:292px;max-height:calc(100vh - 32px);overflow:auto;padding:12px;border:1px solid var(--border);border-radius:14px;background:var(--panel);backdrop-filter:blur(16px);box-shadow:0 14px 50px rgba(0,0,0,.35);scrollbar-width:none;user-select:none}.ui::-webkit-scrollbar{display:none}.group+.group{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.08)}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;font-size:11px;line-height:1.15}.row.tight{margin-top:7px}.label{font-weight:600}.value{color:var(--muted);font-variant-numeric:tabular-nums}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:6px}button,select{appearance:none;width:100%;border:1px solid rgba(255,255,255,.12);border-radius:9px;background:#1a1a1b;color:#f6f6f6;font:inherit;font-size:11px;padding:9px 10px;outline:none;color-scheme:dark}button{cursor:pointer;font-weight:600}button:hover{background:#232325}option{background:#171718;color:#fff}input[type=range]{display:block;width:100%;height:14px;margin:0;padding:0;appearance:none;background:transparent;cursor:ew-resize}input[type=range]::-webkit-slider-runnable-track{height:2px;border-radius:2px;background:var(--track)}input[type=range]::-webkit-slider-thumb{appearance:none;width:10px;height:10px;margin-top:-4px;border:0;border-radius:50%;background:#fff}input[type=range]::-moz-range-track{height:2px;border:0;background:var(--track)}input[type=range]::-moz-range-thumb{width:10px;height:10px;border:0;border-radius:50%;background:#fff}.gradient-wrap{position:relative;padding:10px 0 13px}.gradient-bar{height:22px;border-radius:7px;border:1px solid rgba(255,255,255,.14)}.stop-handle{position:absolute;top:4px;width:16px;height:31px;transform:translateX(-50%);cursor:ew-resize;touch-action:none}.stop-handle:before{content:"";position:absolute;left:2px;top:0;width:12px;height:12px;border-radius:50%;background:var(--stop);border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.6)}.stop-handle:after{content:"";position:absolute;left:7px;top:15px;width:2px;height:8px;border-radius:1px;background:rgba(255,255,255,.65)}.hidden-color{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}.small-note{font-size:10px;color:rgba(255,255,255,.38);line-height:1.35}.color-meta{display:flex;justify-content:space-between;margin-top:2px;font-size:9px;color:rgba(255,255,255,.34)}#fatal{display:none;position:fixed;z-index:9999;left:16px;top:16px;max-width:50vw;padding:10px 12px;border-radius:10px;background:#2b1114;color:#ffb6bc;font:12px/1.4 ui-monospace,monospace;white-space:pre-wrap}
</style>
</head>
<body>
<div id="fatal"></div>
<canvas id="canvas"></canvas>
<div class="hint">topographic / heatmap generator</div>
<div class="seed" id="seedLabel">seed —</div>
<div class="ui">
  <div class="group"><div class="buttons"><button id="randomizeBtn">randomize form</button><button id="randomColorsBtn">random colors</button><button id="copyJsonBtn">copy json</button><button id="saveBtn">save png</button></div></div>
  <div class="group">
    <div class="row"><span class="label">mode</span></div>
    <select id="mode"><option value="heat">heat flow</option><option value="contour" selected>contour blend</option><option value="grid">grid map</option><option value="lines">line map</option></select>
    <div class="row tight"><span class="label">color system</span></div>
    <select id="colorFamily"><option value="saved" selected>saved palettes</option><option value="free">free color</option></select>
    <div class="row tight"><span class="label">palette preset</span></div><select id="colorMode"></select>
    <div class="small-note" id="colorNote" style="margin-top:8px"></div>
  </div>
  <div class="group"><div class="row"><span class="label">spots</span><span class="value" id="spotsValue">5</span></div><input id="spots" type="range" min="1" max="10" step="1" value="5"><div class="row tight"><span class="label">edit spot</span><span class="value" id="activeSpotValue">1</span></div><select id="activeSpot"></select></div>
  <div class="group"><div class="row"><span class="label">spot gradient</span><span class="value">drag stops · click color</span></div><div class="gradient-wrap" id="gradientWrap"><div class="gradient-bar" id="gradientBar"></div><div class="stop-handle" data-index="0"></div><div class="stop-handle" data-index="1"></div><div class="stop-handle" data-index="2"></div><input class="hidden-color" type="color" id="color0"><input class="hidden-color" type="color" id="color1"><input class="hidden-color" type="color" id="color2"></div><div class="color-meta"><span>low</span><span>high</span></div></div>
  <div class="group"><div class="row"><span class="label">distance</span><span class="value" id="distanceValue">0.38</span></div><input id="distance" type="range" min="0" max="1" step="0.01" value="0.38"><div class="row tight"><span class="label">distance variance</span><span class="value" id="distanceVarianceValue">0.54</span></div><input id="distanceVariance" type="range" min="0" max="1" step="0.01" value="0.54"></div>
  <div class="group"><div class="row"><span class="label">levels</span><span class="value" id="levelsValue">11</span></div><input id="levels" type="range" min="4" max="24" step="1" value="11"><div class="row tight"><span class="label">connectedness</span><span class="value" id="connectionValue">0.62</span></div><input id="connection" type="range" min="0" max="1" step="0.01" value="0.62"><div class="row tight"><span class="label">warp</span><span class="value" id="warpValue">0.18</span></div><input id="warp" type="range" min="0" max="0.6" step="0.01" value="0.18"></div>
  <div class="group"><div class="row"><span class="label">gradient blend</span><span class="value" id="blendValue">0.72</span></div><input id="blend" type="range" min="0" max="1" step="0.01" value="0.72"><div class="row tight"><span class="label">line opacity</span><span class="value" id="lineOpacityValue">0.38</span></div><input id="lineOpacity" type="range" min="0" max="1" step="0.01" value="0.38"><div class="row tight"><span class="label">grid pixel</span><span class="value" id="gridPixelValue">18</span></div><input id="gridPixel" type="range" min="6" max="240" step="1" value="18"></div>
</div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d',{alpha:false}),$=id=>document.getElementById(id),fatal=$('fatal');
window.addEventListener('error',e=>{fatal.style.display='block';fatal.textContent='Runtime error: '+(e.message||'unknown')});
window.addEventListener('unhandledrejection',e=>{fatal.style.display='block';fatal.textContent='Promise error: '+String(e.reason?.message||e.reason||'unknown')});
const C={randomize:$('randomizeBtn'),randomColors:$('randomColorsBtn'),copyJson:$('copyJsonBtn'),save:$('saveBtn'),mode:$('mode'),colorFamily:$('colorFamily'),colorMode:$('colorMode'),spots:$('spots'),activeSpot:$('activeSpot'),distance:$('distance'),distanceVariance:$('distanceVariance'),levels:$('levels'),connection:$('connection'),warp:$('warp'),blend:$('blend'),lineOpacity:$('lineOpacity'),gridPixel:$('gridPixel')};
const L={spots:$('spotsValue'),activeSpot:$('activeSpotValue'),distance:$('distanceValue'),distanceVariance:$('distanceVarianceValue'),levels:$('levelsValue'),connection:$('connectionValue'),warp:$('warpValue'),blend:$('blendValue'),lineOpacity:$('lineOpacityValue'),gridPixel:$('gridPixelValue'),seed:$('seedLabel')};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
function mulberry32(a){return()=>{let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function hexToRgb(h){const n=parseInt(h.replace('#',''),16);return[(n>>16)&255,(n>>8)&255,n&255]}
function rgbToHex(a){return'#'+a.map(v=>Math.round(clamp(v,0,255)).toString(16).padStart(2,'0')).join('')}
function mix(a,b,t){return[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)]}
function hslToRgb(h,s,l){h=((h%360)+360)%360;s/=100;l/=100;const c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2;let r=0,g=0,b=0;if(h<60)[r,g,b]=[c,x,0];else if(h<120)[r,g,b]=[x,c,0];else if(h<180)[r,g,b]=[0,c,x];else if(h<240)[r,g,b]=[0,x,c];else if(h<300)[r,g,b]=[x,0,c];else[r,g,b]=[c,0,x];return[(r+m)*255,(g+m)*255,(b+m)*255]}
function valueNoise(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),tx=x-xi,ty=y-yi,sx=tx*tx*(3-2*tx),sy=ty*ty*(3-2*ty);const h=(ix,iy)=>{let n=Math.imul(ix+374761393,668265263)^Math.imul(iy+1274126177,2246822519)^s;n=Math.imul(n^(n>>>13),1274126177);return((n^(n>>>16))>>>0)/4294967295};return lerp(lerp(h(xi,yi),h(xi+1,yi),sx),lerp(h(xi,yi+1),h(xi+1,yi+1),sx),sy)}
function fbm(x,y,s){let v=0,a=.5,f=1,n=0;for(let i=0;i<4;i++){v+=valueNoise(x*f,y*f,s+i*31)*a;n+=a;a*=.5;f*=2}return v/n}
const palettes={clay:['#DCD8D5','#221B18','#FF6B57','#F16754','#EEB9AE','#8A4336','#385066','#D6DEE6','#B5AFAD','#5F5A58'],signal:['#F9F8F4','#F3F0E9','#A7A49B','#262626','#191919','#7D45FE','#451D66','#BF3049','#FF566D'],coralSlate:['#F9F8F4','#F3F0E9','#A7A49B','#262626','#191919','#FF6A56','#43454F','#5F6E79'],violetSlate:['#F9F8F4','#F3F0E9','#A7A49B','#262626','#191919','#7D45FE','#43454F','#5F6E79'],olive:['#FF6A56','#6F56FF','#413EA7','#FFFFFF','#711564','#F6A38A','#D0BF3A']};
const savedNames={clay:'Clay',signal:'Signal',coralSlate:'Coral Slate',violetSlate:'Violet Slate',olive:'Olive'};
let structureSeed=(Math.random()*1e9)|0,colorSeed=(Math.random()*1e9)|0,spots=[],gradients=[],active=0,raf=0;
const handles=[...document.querySelectorAll('.stop-handle')],colors=[0,1,2].map(i=>$('color'+i));
function makeStops(cs){return cs.map((color,i)=>({color,pos:i/(cs.length-1)}))}
function sampleStops(stops,t){t=clamp(t,0,1);const s=[...stops].sort((a,b)=>a.pos-b.pos);if(t<=s[0].pos)return hexToRgb(s[0].color);for(let i=0;i<s.length-1;i++){if(t<=s[i+1].pos){const q=(t-s[i].pos)/Math.max(.0001,s[i+1].pos-s[i].pos);return mix(hexToRgb(s[i].color),hexToRgb(s[i+1].color),q)}}return hexToRgb(s[s.length-1].color)}
function dist(a,b){const A=hexToRgb(a),B=hexToRgb(b);return Math.hypot(A[0]-B[0],A[1]-B[1],A[2]-B[2])}
function cohesiveTriplet(pool,rnd){const anchor=pool[Math.floor(rnd()*pool.length)],near=pool.filter(x=>x!==anchor).sort((a,b)=>dist(a,anchor)-dist(b,anchor)),arr=[anchor,near[Math.min(near.length-1,Math.floor(rnd()*Math.min(3,near.length)))],near[Math.min(near.length-1,1+Math.floor(rnd()*Math.min(4,Math.max(1,near.length-1))))]];return [...new Set(arr)].concat(pool).slice(0,3)}
function randomFree(rnd){const h=rnd()*360,spread=18+rnd()*80;return[0,1,2].map((_,i)=>rgbToHex(hslToRgb(h+(i-1)*spread,50+rnd()*30,12+i*24+rnd()*10)))}
function currentPool(rnd){return C.colorFamily.value==='saved'?cohesiveTriplet(palettes[C.colorMode.value]||palettes.clay,rnd):randomFree(rnd)}
function rebuildPalette(){const prev=C.colorMode.value;C.colorMode.innerHTML='';if(C.colorFamily.value==='saved'){Object.entries(savedNames).forEach(([v,n])=>C.colorMode.add(new Option(n,v)));if(savedNames[prev])C.colorMode.value=prev;$('colorNote').textContent='Curated palettes only. Every spot uses a 3-color gradient from the selected palette.'}else{C.colorMode.add(new Option('free random','free'));$('colorNote').textContent='Three-stop gradients generated freely across the color wheel.'}}
function randomizeColors(){const rnd=mulberry32(colorSeed);gradients=Array.from({length:+C.spots.value},()=>makeStops(currentPool(rnd)));updateGradientUI();schedule()}
function randomizeForm(){structureSeed=(Math.random()*1e9)|0;buildSpots();schedule()}
function buildSpots(){const rnd=mulberry32(structureSeed),n=+C.spots.value,d=lerp(.07,.30,+C.distance.value),v=+C.distanceVariance.value;spots=[];const center={x:.5+(rnd()-.5)*.08,y:.5+(rnd()-.5)*.08};for(let i=0;i<n;i++){let best=null,bestScore=-1e9;for(let k=0;k<100;k++){const parent=i&&rnd()<.55?spots[Math.floor(rnd()*spots.length)]:center,ang=rnd()*Math.PI*2,rad=d*(.35+rnd()*(1.1+v*1.8)),x=clamp(parent.x+Math.cos(ang)*rad,.06,.94),y=clamp(parent.y+Math.sin(ang)*rad,.06,.94);let min=1;if(spots.length)min=Math.min(...spots.map(p=>Math.hypot(p.x-x,p.y-y)));const score=min+(rnd()-.5)*.04;if(score>bestScore){bestScore=score;best={x,y}}}spots.push({...best,amp:.8+rnd()*.45,sx:.06+rnd()*.10,sy:.06+rnd()*.12,ang:rnd()*Math.PI})}}
function ensureGradients(){const n=+C.spots.value;if(gradients.length!==n){const rnd=mulberry32(colorSeed);while(gradients.length<n)gradients.push(makeStops(currentPool(rnd)));gradients=gradients.slice(0,n)}active=clamp(active,0,n-1);C.activeSpot.innerHTML='';for(let i=0;i<n;i++)C.activeSpot.add(new Option('spot '+(i+1),String(i)));C.activeSpot.value=String(active)}
function updateGradientUI(){ensureGradients();const g=gradients[active]||makeStops(['#111','#777','#fff']);const css=g.map(s=>`${s.color} ${Math.round(s.pos*100)}%`).join(',');$('gradientBar').style.background=`linear-gradient(90deg,${css})`;handles.forEach((h,i)=>{h.style.left=(g[i].pos*100)+'%';h.style.setProperty('--stop',g[i].color)});colors.forEach((inp,i)=>inp.value=g[i].color);L.activeSpot.textContent=String(active+1)}
function updateLabels(){L.spots.textContent=C.spots.value;L.distance.textContent=(+C.distance.value).toFixed(2);L.distanceVariance.textContent=(+C.distanceVariance.value).toFixed(2);L.levels.textContent=C.levels.value;L.connection.textContent=(+C.connection.value).toFixed(2);L.warp.textContent=(+C.warp.value).toFixed(2);L.blend.textContent=(+C.blend.value).toFixed(2);L.lineOpacity.textContent=(+C.lineOpacity.value).toFixed(2);L.gridPixel.textContent=C.gridPixel.value;L.seed.textContent=`seed ${structureSeed}/${colorSeed}`}
function resize(){const dpr=Math.min(2,window.devicePixelRatio||1),w=Math.max(1,innerWidth),h=Math.max(1,innerHeight);const W=Math.round(w*dpr),H=Math.round(h*dpr);if(canvas.width!==W||canvas.height!==H){canvas.width=W;canvas.height=H}}
function bridges(){const out=[];for(let i=1;i<spots.length;i++){let j=0,bd=1e9;for(let k=0;k<i;k++){const d=Math.hypot(spots[i].x-spots[k].x,spots[i].y-spots[k].y);if(d<bd){bd=d;j=k}}out.push([i,j])}return out}
function render(){raf=0;resize();ensureGradients();updateLabels();const mode=C.mode.value,pix=+C.gridPixel.value,aspect=canvas.width/canvas.height;let sw=mode==='grid'?Math.max(18,Math.round(canvas.width/(pix*(window.devicePixelRatio||1)))):220,sh=Math.max(24,Math.round(sw/aspect));sw=Math.min(sw,320);sh=Math.min(sh,240);const off=document.createElement('canvas');off.width=sw;off.height=sh;const ox=off.getContext('2d'),img=ox.createImageData(sw,sh),data=img.data,levels=+C.levels.value,warp=+C.warp.value,conn=+C.connection.value,bs=bridges();for(let y=0;y<sh;y++)for(let x=0;x<sw;x++){let u=x/(sw-1),v=y/(sh-1),n=fbm(u*3.5,v*3.5,structureSeed);u=clamp(u+(n-.5)*warp*.12,0,1);v=clamp(v+(fbm(u*4+9,v*4+2,structureSeed+17)-.5)*warp*.12,0,1);let field=0,cr=0,cg=0,cb=0,cw=0;for(let i=0;i<spots.length;i++){const p=spots[i],ca=Math.cos(p.ang),sa=Math.sin(p.ang),dx=u-p.x,dy=v-p.y,rx=dx*ca+dy*sa,ry=-dx*sa+dy*ca,val=p.amp*Math.exp(-.5*((rx*rx)/(p.sx*p.sx)+(ry*ry)/(p.sy*p.sy)));field+=val;const col=sampleStops(gradients[i],clamp(val/p.amp,0,1));const w=Math.pow(val,1.15);cr+=col[0]*w;cg+=col[1]*w;cb+=col[2]*w;cw+=w}for(const [a,b] of bs){const A=spots[a],B=spots[b],vx=B.x-A.x,vy=B.y-A.y,l2=vx*vx+vy*vy,t=clamp(((u-A.x)*vx+(v-A.y)*vy)/(l2||1),0,1),px=A.x+vx*t,py=A.y+vy*t,d2=(u-px)**2+(v-py)**2,s=.035+.055*conn,val=Math.exp(-d2/(2*s*s))*conn*.75;field+=val;const ca=sampleStops(gradients[a],.55),cbv=sampleStops(gradients[b],.55),col=mix(ca,cbv,t),w=val*.8;cr+=col[0]*w;cg+=col[1]*w;cb+=col[2]*w;cw+=w}field+=n*.12;let base=cw?[cr/cw,cg/cw,cb/cw]:[0,0,0],strength=clamp(field*.62,0,1);base=base.map(c=>c*Math.pow(strength,.78));if(mode==='contour'||mode==='grid'){const q=Math.floor(strength*levels)/Math.max(1,levels-1);base=base.map(c=>c*lerp(.68,1.12,q));if(mode==='contour'){const f=strength*levels,edge=Math.abs(f-Math.round(f));if(edge<.055)base=base.map(c=>lerp(c,255,+C.lineOpacity.value*.55))}}if(mode==='lines'){const f=strength*levels,edge=Math.abs(f-Math.round(f));if(edge<.06)base=base.map(c=>lerp(c,255,+C.lineOpacity.value));else base=base.map(c=>c*.42)}const k=(y*sw+x)*4;data[k]=base[0];data[k+1]=base[1];data[k+2]=base[2];data[k+3]=255}ox.putImageData(img,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.imageSmoothingEnabled=mode!=='grid';ctx.drawImage(off,0,0,canvas.width,canvas.height)}
function schedule(){if(!raf)raf=requestAnimationFrame(render)}
function exportState(){return{version:3,seed:structureSeed,colorSeed,controls:{mode:C.mode.value,colorFamily:C.colorFamily.value,colorMode:C.colorMode.value,spots:+C.spots.value,distance:+C.distance.value,distanceVariance:+C.distanceVariance.value,levels:+C.levels.value,connection:+C.connection.value,warp:+C.warp.value,blend:+C.blend.value,lineOpacity:+C.lineOpacity.value,gridPixel:+C.gridPixel.value},spotGradients:gradients.map(g=>g.map(s=>({color:s.color,pos:+s.pos.toFixed(4)}))),spots:spots.map(p=>({x:+p.x.toFixed(5),y:+p.y.toFixed(5),amp:+p.amp.toFixed(4),sx:+p.sx.toFixed(5),sy:+p.sy.toFixed(5),angle:+p.ang.toFixed(5)}))}}
C.randomize.onclick=()=>randomizeForm();C.randomColors.onclick=()=>{colorSeed=(Math.random()*1e9)|0;randomizeColors()};C.copyJson.onclick=async()=>{const t=JSON.stringify(exportState(),null,2);try{await navigator.clipboard.writeText(t);C.copyJson.textContent='copied';setTimeout(()=>C.copyJson.textContent='copy json',900)}catch{prompt('copy json',t)}};C.save.onclick=()=>{const a=document.createElement('a');a.download=`topo-${structureSeed}.png`;a.href=canvas.toDataURL('image/png');a.click()};C.colorFamily.onchange=()=>{rebuildPalette();colorSeed=(Math.random()*1e9)|0;randomizeColors()};C.colorMode.onchange=()=>{colorSeed=(Math.random()*1e9)|0;randomizeColors()};C.spots.oninput=()=>{ensureGradients();buildSpots();updateGradientUI();schedule()};C.activeSpot.onchange=()=>{active=+C.activeSpot.value;updateGradientUI()};[C.mode,C.distance,C.distanceVariance,C.levels,C.connection,C.warp,C.blend,C.lineOpacity,C.gridPixel].forEach(el=>el.oninput=()=>{if(el===C.distance||el===C.distanceVariance)buildSpots();updateLabels();schedule()});handles.forEach((h,i)=>{h.addEventListener('pointerdown',e=>{h.setPointerCapture(e.pointerId);const move=ev=>{const r=$('gradientWrap').getBoundingClientRect(),g=gradients[active];g[i].pos=clamp((ev.clientX-r.left)/r.width,0,1);g.sort((a,b)=>a.pos-b.pos);updateGradientUI();schedule()};h.addEventListener('pointermove',move);h.addEventListener('pointerup',()=>{h.removeEventListener('pointermove',move)},{once:true})});h.addEventListener('click',()=>colors[i].click())});colors.forEach((inp,i)=>inp.oninput=()=>{gradients[active][i].color=inp.value;updateGradientUI();schedule()});window.addEventListener('resize',schedule);rebuildPalette();ensureGradients();randomizeColors();buildSpots();updateGradientUI();updateLabels();render();
})();
</script>
</body></html>
